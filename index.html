<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>宇飞 · 导师申请工作台</title><link rel="stylesheet" href="style.css">
<body><header><span class="logo">YF</span><div><small>2027 PHD APPLICATION</small><h1>导师申请工作台</h1></div><button id="lock" hidden>退出</button></header>
<main><section id="login" class="login"><p class="eyebrow">私人工作台</p><h2>继续你的申请</h2><p>用原来的访问密码解锁。密码只用于本机加解密，不会发送到服务器。</p><form id="unlock"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required><button>进入工作台</button></form><p id="error" role="alert"></p></section>
<div id="workspace" hidden><div class="connection"><p id="agent-status" role="status">正在连接独立后台…</p><button id="check-tasks" class="secondary">重连 / 查看进度</button></div>
<nav><button data-view="chat" aria-pressed="true">与 Agent 对话</button><button data-view="advisors" aria-pressed="false">导师状态</button></nav>
<section id="chat"><div class="chat-heading"><div><h2>和申请助手聊一聊</h2><p class="muted">直接提问或布置任务，回复和进度会出现在这里。</p></div><button id="new-chat" class="secondary">新对话</button></div>
<label for="conversation" class="sr-only">选择对话</label><select id="conversation"></select>
<div class="shortcuts" aria-label="快捷请求"><button id="chat-refresh" class="secondary">刷新邮件状态</button><button id="chat-summary" class="secondary">总结最新进展</button><button id="chat-prepare" class="secondary">准备导师交流</button></div>
<div id="messages" role="log" aria-label="对话记录" aria-live="polite"></div>
<form id="chat-form" class="composer"><label for="advisor">关联导师（可选）</label><select id="advisor"><option value="">不限导师</option></select><label for="request" class="sr-only">消息</label><textarea id="request" maxlength="4000" rows="3" required placeholder="例如：刚才这两位导师，我该先准备哪些交流问题？"></textarea><div class="composer-bottom"><span class="muted">支持连续对话 · Ctrl / ⌘ + Enter 发送</span><button id="chat-send">发送</button></div><p id="chat-notice" role="status"></p></form>
<p class="muted">快捷按钮会发送一条准备好的请求。仅刷新按钮检查真实邮箱；其他问题按你的要求处理。已支持按你的明确请求发送邮件；发送前核对内容，发送后核实结果。</p>
<details id="legacy"><summary>查看此前任务</summary><div id="results"></div></details></section>
<section id="advisors" hidden><div id="stats" class="stats"></div><p id="coverage" class="muted"></p><button id="refresh-mail" type="button">在对话中刷新邮件状态</button><div class="tools"><input id="search" placeholder="搜索姓名、学校、方向"><select id="filter"><option value="">全部状态</option><option>未收到回复</option><option>已有进展，等待回复</option><option>已有新回复，待处理</option><option>仅自动回复，等待答复</option></select><button id="export">导出 CSV</button></div><div id="rows"></div></section>
</div></main><footer>香港时间 · 独立后台代理 · 电脑联网时处理任务</footer><script type="module" src="app.js?v=c8f55c0df1d3"></script></body></html>
