<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>宇飞 · 导师申请工作台</title><link rel="stylesheet" href="style.css"><body><header><span class="logo">YF</span><div><small>2027 PHD APPLICATION</small><h1>导师申请工作台</h1></div><button id="lock" hidden>退出</button></header><main><section id="login" class="login"><p class="eyebrow">私人工作台</p><h2>继续你的申请</h2><p>用原来的访问密码解锁导师记录。密码只用于本机解密，不会发送到服务器。</p><form id="unlock"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required><button>进入工作台</button></form><p id="error" role="alert"></p></section><div id="workspace" hidden><p id="agent-status" role="status">正在连接独立后台…</p><button id="check-tasks">查看任务状态</button><nav><button data-view="advisors">导师状态</button><button data-view="tasks">布置任务</button><button data-view="history">任务结果</button></nav><section id="advisors"><div id="stats" class="stats"></div><p id="coverage" class="muted"></p><button id="refresh-mail" type="button">刷新邮件状态</button><p class="muted">按钮直接提交一次检查；页面显示处理进度和结果。不发送邮件。</p><p id="refresh-message" role="status"></p><div class="tools"><input id="search" placeholder="搜索姓名、学校、方向"><select id="filter"><option value="">全部状态</option><option>未收到回复</option><option>已有进展，等待回复</option><option>已有新回复，待处理</option><option>仅自动回复，等待答复</option></select><button id="export">导出 CSV</button></div><div id="rows"></div></section><section id="tasks" hidden><h2>给独立后台代理布置任务</h2><p>网页直接提交加密任务，无需 GitHub 或 GPT 登录。独立代理使用同一工作区，电脑和应用在线时处理。</p><form id="task"><label for="advisor">关联导师（可选）</label><select id="advisor"><option value="">不限导师</option></select><label for="request">要做什么</label><textarea id="request" maxlength="4000" rows="7" required placeholder="例如：检查李鸿升的新回信，整理项目条件；先不要回复。"></textarea><button>直接提交任务</button></form><p id="task-message" role="status"></p><p class="muted">当前支持检查邮件和整理材料，暂不代发邮件。连接中断时先查看任务状态，不要重复提交。</p></section><section id="history" hidden><h2>任务结果</h2><div id="results"></div><a href="https://github.com/LiYufei2004/yufei-phd-tracker/issues" target="_blank" rel="noopener noreferrer">打开 GitHub 查看是否提交成功</a></section></div></main><footer>香港时间 · 状态来自已核实日志，非实时邮箱</footer><script type="module" src="app.js?v=42dde7b708b7"></script></body></html>
